[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedup"
version = "1.0.0"
description = "Profiling and speeding up PyTorch training on Fashion-MNIST"
requires-python = ">=3.10"
authors = [{ name = "Akinpelumi Michael Ajayi" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
